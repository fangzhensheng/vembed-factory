# Qwen3-VL with SwanLab Tracking
# This example shows how to integrate SwanLab (Chinese-friendly) for experiment tracking

# Model and data
model_name: Qwen/Qwen3-VL-2B-Instruct
encoder_mode: qwen3_vl
data_path: data/stanford_online_products/train.jsonl
val_data_path: data/stanford_online_products/val.jsonl
image_root: data/stanford_online_products

# Training setup
batch_size: 32
epochs: 3
learning_rate: 5e-5
warmup_steps: 100

# Loss and retrieval
loss_type: infonce
retrieval_mode: t2i
pooling_method: cls

# Memory optimization (Qwen3-VL is larger)
use_gradient_cache: true
gradient_cache_chunk_size: 64
gradient_accumulation_steps: 2
gradient_checkpointing: true

# Experiment tracking with SwanLab (Chinese version of W&B)
# Installation: pip install swanlab
# Usage: swanlab login (if not already authenticated)
report_to: swanlab
run_name: "qwen3-vl-2b-sop"  # Experiment name visible in SwanLab dashboard

# Optional: Add tags for filtering in SwanLab
run_tags: [qwen3-vl, multimodal, production]

# Optional: Add notes/description visible in SwanLab
run_notes: "Qwen3-VL 2B multimodal training on Stanford Online Products"

# Output
output_dir: experiments/qwen3_vl_swanlab
logging_steps: 10
save_steps: 500
eval_steps: 1000

# Optional validation
validate_data: false
