# COCO Dataset Training Configuration
# Dual-encoder CLIP model for image-text retrieval (I2T)
# Optimized for consumer-grade GPUs (24-40GB VRAM)

model_name_or_path: "openai/clip-vit-base-patch32"
encoder_mode: clip
retrieval_mode: "t2i"  # text-to-image (captions to images)
use_lora: true

# Memory optimization: Gradient Cache
# Reduces memory consumption by ~4× (slight speed trade-off)
use_gradient_cache: true
gradient_cache_chunk_size: 128

output_dir: experiments/coco_clip
epochs: 5
batch_size: 512
learning_rate: 1.0e-5

# COCO dataset paths (generated by prepare_coco.py)
data_path: data/coco/train.jsonl
val_data_path: data/coco/val.jsonl
image_root: data/coco/images

# Data validation: check format before training
validate_data: false

# Data loading optimization
num_workers: 8
pin_memory: true
prefetch_factor: 2
persistent_workers: true

# Image caching: enable for multi-epoch training
enable_image_cache: false
