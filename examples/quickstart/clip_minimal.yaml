dataset_name: flickr30k_t2i

model_name_or_path: "openai/clip-vit-base-patch32"
encoder_mode: clip
retrieval_mode: "t2i"
use_lora: true

use_gradient_cache: true
gradient_cache_chunk_size: 128

output_dir: experiments/clip_minimal
epochs: 2
batch_size: 256
learning_rate: 1.0e-5

validate_data: false

# Data loading optimization
num_workers: 4
pin_memory: true
prefetch_factor: 2
persistent_workers: true

enable_image_cache: false
