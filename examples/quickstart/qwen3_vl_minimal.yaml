# Qwen3-VL-Embedding-2B Minimal Training Configuration
# Fastest setup for testing and validation
# Optimized for 24GB consumer-grade GPUs

# Model
model_name: "Qwen/Qwen3-VL-Embedding-2B"
encoder_mode: "qwen-vl"
retrieval_mode: "t2i"
attn_implementation: "flash_attention_2"
torch_dtype: "bfloat16"

# Data (use sample data)
data_path: "data/train.jsonl"
val_data_path: "data/val.jsonl"
image_root: "data/images"

# Training
output_dir: "experiments/output_qwen3_2b_minimal"
epochs: 2
batch_size: 64
learning_rate: 2.0e-5
loss_type: "infonce"

# Memory Optimization
use_gradient_cache: true
gradient_cache_chunk_size: 64
gradient_checkpointing: true
use_lora: true

# Multi-Resolution Learning (minimal dims for faster testing)
use_mrl: true
mrl_dims: [512]
