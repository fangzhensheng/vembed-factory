dataset_name: "flickr30k_t2i"

model_name: "Qwen/Qwen3-VL-Embedding-2B"
encoder_mode: "qwen3_vl"
retrieval_mode: "t2i"
attn_implementation: "flash_attention_2"
torch_dtype: "bfloat16"

# Training
output_dir: "experiments/output_distributed_tracked"
epochs: 5
batch_size: 128
learning_rate: 2.0e-5
loss_type: "infonce"

# Memory Optimization
use_gradient_cache: true
gradient_cache_chunk_size: 64
gradient_checkpointing: true
use_lora: true

# Experiment Tracking Configuration
# Option 1: Weights & Biases (W&B)
report_to: wandb
run_name: "qwen3-vl-multimodal-training"
wandb_project: "vembed-factory"
wandb_entity: "your-team-name"  # Change this to your team name

# Option 2: SwanLab (Chinese-friendly, uncomment to use)
# report_to: swanlab
# run_name: "qwen3-vl-multimodal-training"

# Logging settings
logging_steps: 10
save_steps: 500
eval_steps: 1000

# Tags for experiment organization
tags: [qwen3-vl, multimodal, distributed, tracking]

# Distributed training launch command:
# torchrun --nproc_per_node=4 train.py --config_path distributed/with_tracking.yaml
